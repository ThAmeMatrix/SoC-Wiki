<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#233f35">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://wiki.biligame.com https://patchwiki.biligame.com; frame-src 'none'; object-src 'none'; base-uri 'self'">
  <meta name="description" content="铃兰之剑离线资料馆。角色、装备、技能、攻略，全都随身携带。">
  <title>铃兰档案馆 · 离线 Wiki</title>
  <link rel="icon" href="assets/brand/logo.webp">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="refinements.css">
  <link rel="stylesheet" href="character-ui.css">
  <link rel="stylesheet" href="infographic.css">
  <link rel="stylesheet" href="updates-search.css">
  <script src="data/index.js" defer></script>
  <script src="data/update-baseline.js" defer></script>
  <script src="wiki-update-convert.js" defer></script>
  <script src="wiki-updates.js" defer></script>
  <script src="semantic-core.js" defer></script>
  <script src="semantic-ui.js" defer></script>
  <script src="data/tools.js" defer></script>
  <script src="tools-core.js" defer></script>
  <script src="personal-data.js" defer></script>
  <script src="infographic-core.js" defer></script>
  <script src="infographic-canvas.js" defer></script>
  <script src="infographic-title-image.js" defer></script>
  <script src="infographic-ui.js" defer></script>
  <script src="tools-ui.js" defer></script>
  <script src="character-ui.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到正文</a>
  <aside id="sidebar" class="sidebar" aria-label="主导航"></aside>
  <div class="nav-scrim" id="nav-scrim"></div>
  <div class="workspace">
    <header class="topbar">
      <button class="icon-button mobile-menu" data-action="menu" aria-label="展开导航"></button>
      <div class="breadcrumb" id="breadcrumb">资料馆 <span>/</span> 总览</div>
      <button class="global-search" data-action="search" aria-label="搜索全部资料，快捷键 Ctrl K"><span id="search-icon"></span><span>搜索名称、技能效果、攻略…</span><kbd>Ctrl K</kbd></button>
      <div class="top-actions"><span class="offline-indicator"><i></i> 离线可用</span><button class="icon-button" data-action="theme" aria-label="切换深色模式" title="切换明暗主题"></button><a href="#/archive" class="avatar" title="资料馆信息" aria-label="资料馆信息">兰</a></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer"><span>为这和平的世界，珍藏每一段旅程。</span><span>资料来自 BWIKI · 铃兰小站 <span class="footer-leaf">✧</span> 个人离线档案</span></footer>
  </div>
  <div id="compare-dock"></div>
  <dialog id="search-dialog" class="search-dialog" aria-label="搜索资料馆">
    <div class="search-dialog-input"><span id="dialog-search-icon"></span><input id="quick-search" placeholder="角色名、别名、驱散我方减益…" maxlength="60" autocomplete="off" aria-label="搜索关键词"><button type="button" class="search-clear" data-search-clear="quick-search" aria-label="清空搜索关键词" title="清空关键词" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg><span>清空</span></button><button class="key-button" data-action="close-search">Esc</button></div>
    <div id="quick-results"></div><div class="search-dialog-footer"><span><kbd>↑</kbd><kbd>↓</kbd> 选择 <kbd>Enter</kbd> 打开</span><span>全部内容均可离线搜索</span></div>
  </dialog>
  <dialog id="image-dialog" class="image-dialog" aria-label="查看原图"><div class="image-toolbar"><span id="image-caption"></span><button class="text-button" data-action="zoom-image">放大 / 适应</button><a id="image-download" download>保存图片</a><button class="icon-button" data-action="close-image" aria-label="关闭图片">×</button></div><div class="image-stage"><img id="lightbox-image" alt=""></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><p class="noscript">请启用浏览器 JavaScript 后打开资料馆。所有脚本和数据均保存在本地，无需联网。</p></noscript>
</body>
</html>
